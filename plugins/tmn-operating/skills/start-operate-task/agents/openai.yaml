interface:
  display_name: "Start Operations Task"
  short_description: "착수 조건을 확인하고 리뷰·회고 뒤 작업을 완료합니다"
  default_prompt: "Use $start-operate-task to research and execute this Slack List task, keep it pending until I approve completion, and run the postmortem check before completing it."
dependencies:
  tools:
    - type: "mcp"
      value: "team-monolith-knowledge"
      description: "실제 작업 전에 관련 사내 과거 기록과 기존 결정을 조사하는 전사 지식 MCP"
      transport: "streamable_http"
      url: "https://wfa.codle.io/mcp"
    - type: "mcp"
      value: "team-monolith-operations-task"
      description: "운영팀 Slack List 작업을 시작·재개하고 포스트모템·개선 작업·승인된 완료 결과를 게시하는 전용 MCP"
      transport: "streamable_http"
      url: "https://wfa.codle.io/mcp/operate"
policy:
  allow_implicit_invocation: true
